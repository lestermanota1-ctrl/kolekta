function sForm(id,keep){const s=keep&&S.draft?S.draft:(S.st.find(x=>x.id===id)||{id:'',name:'',section:S.lsec||'',qr:''});modal(`<h2>${id?'Edit':'Add'} student</h2>${fld('id','Student ID',s.id)}${fld('name','Full name',s.name)}${fld('sec','Section',s.section)}<label>Email for receipts (optional)<input id=f_em type=email inputmode=email value="${esc(s.email||'')}" placeholder="name@gmail.com"></label><label>ID card QR code<input id=f_qr value="${esc(s.qr||'')}" placeholder="Scan the QR on the student's ID"></label><button class="btn a" onclick="scanQR('${esc(id||'')}')">Scan the QR on the ID</button><div class=s>Leave blank to make a new QR instead.</div><button class=btn onclick="saveS('${esc(id||'')}')">Save student</button>${S.fast?'<button class="btn s2" onclick=endFast()>Stop fast register</button>':''}`)}

async function startQ(old){try{qs=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('#cv');v.srcObject=qs;await v.play();const det=window.BarcodeDetector?new BarcodeDetector({formats:['qr_code']}):null;const loop=async()=>{if(!qs)return;let val;try{if(det){const r=await det.detect(v);val=r[0]&&r[0].rawValue}else{const cv=document.createElement('canvas');cv.width=v.videoWidth;cv.height=v.videoHeight;const x=cv.getContext('2d');x.drawImage(v,0,0);const d=x.getImageData(0,0,cv.width,cv.height);const q=jsQR(d.data,d.width,d.height);val=q&&q.data}}catch(e){}if(val){const p=parseId(val),ex=findQr(val);
if(ex&&ex.id!==old){navigator.vibrate&&navigator.vibrate([80,60,80]);toast(ex.name+' is already registered',1);if(S.fast){qt=setTimeout(loop,1500);return}stopQ();sForm(old,1);return}
stopQ();navigator.vibrate&&navigator.vibrate(100);S.draft.qr=val;if(p&&!old){S.draft.id=p.id;if(p.name)S.draft.name=p.name}sForm(old,1);done(p&&!old?'ID scanned':'QR captured');return}qt=setTimeout(loop,250)};loop()}catch(e){toast('Camera blocked. Allow camera access.',1);sForm(old,1)}}
async function saveS(old){const id=fv('id'),name=fv('name'),sec=fv('sec'),em=fv('em');if(!id||!name||!sec)return toast('Fill in all fields',1);if(old&&old!==id&&!isAdmin())return toast('Only the admin can change a student ID',1);if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return toast('Enter a valid email address',1);if(id!==old&&S.st.some(x=>x.id===id))return toast('Student ID already exists',1);
const o=S.st.find(x=>x.id===old);let qr=fv('qr')||(o?o.qr:'');if(S.st.some(x=>x.qr===qr&&x.id!==old))return toast('This QR is already registered to another student',1);if(!qr){do{qr='SCM-'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(36).padStart(2,'0')).join('')}while(S.st.some(x=>x.qr===qr))}
try{if(old&&old!==id)await api('delete',{id:old});await api('upsert',{sheet:'Students',row:{id,name,section:sec,email:em,qr,created:o?o.created:now().date}});await load();closeM();render();S.lsec=sec;done('Student saved',name);if(S.fast&&!old){S.regN=(S.regN||0)+1;setTimeout(()=>scanQR('',1),700)}}catch(e){toast('Could not save. Go online and retry.',1)}}

async function saveE(){if(S.prep)return toast('Photo is still preparing',1);const t=fv('t'),a=Number(fv('a'));if(!t)return toast('Describe what it was for',1);if(!(a>0))return toast('Enter a valid amount',1);if(a>fund()&&!confirm('This is more than the fund balance ('+money(fund())+'). Save anyway?'))return;
const n=now(),id='EX'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(),e={id,clientId:crypto.randomUUID?crypto.randomUUID():id+Math.random(),date:fv('d')||n.date,time:n.time,title:t,category:$('#f_cat').value,amount:a,by:S.name||'admin',status:'VALID',proof:'',note:fv('n')};if(S.proof)e.proofData=S.proof;

 csv:a.map(t=>[t.date,t.time,t.studentId,t.name,t.section,t.collection,Number(t.amount).toFixed(2),t.txid,t.by,t.method||'Cash',t.ref||''])});

if(['day','week','month'].includes(R.type)){const g={};tx.forEach(t=>{const k=R.type==='day'?t.date:R.type==='week'?'Week of '+wk(t.date):t.date.slice(0,7);g[k]=g[k]||[0,0];g[k][0]++;g[k][1]+=Number(t.amount)});
 sum2={head:['Period','Payments','Amount'],body:Object.keys(g).sort().map(k=>[esc(k),g[k][0],money(g[k][1])])};main=txRows(tx)}

function showR(){if(rep.isEx){$('#ro').innerHTML=`<div class=g2><div class=card><div class=s>Total spent</div><b>${money(rep.total)}</b></div><div class=card><div class=s>Entries</div><b>${rep.main.body.length}</b></div></div><div class=card><b>Expenses</b>${tbl(rep.main)}</div><div class=np><button class=btn onclick=csv()>Export Excel (CSV)</button><button class="btn s2" onclick="print()">Save as PDF / Print</button></div>`;return}const p=rep.exp?Math.min(100,rep.col/rep.exp*100):0;$('#ro').innerHTML=`<div class=g2><div class=card><div class=s>Expected</div><b>${money(rep.exp)}</b></div><div class=card><div class=s>Collected</div><b>${money(rep.col)}</b></div><div class=card><div class=s>Remaining</div><b>${money(rep.rem)}</b></div><div class=card><div class=s>Collection</div><b>${p.toFixed(1)}%</b></div></div><div class=pb style="margin-bottom:10px"><i style="width:${p}%"></i></div>${rep.sum2?`<div class=card><b>Summary</b>${tbl(rep.sum2)}</div>`:''}<div class=card><b>${rep.sum2?'Payment details':esc(rep.title)}</b> <span class=s>(${rep.main.body.length})</span>${tbl(rep.main)}</div><div class=np>${rep.list&&rep.list.some(x=>x.b.rem>0)?`<button class="btn a" onclick=remind()>Send reminders (${rep.list.filter(x=>x.b.rem>0).length})</button>`:''}<button class=btn onclick=csv()>Export Excel (CSV)</button><button class="btn s2" onclick="print()">Save as PDF / Print</button></div>`}
function csv(){const t=[rep.main.csvHead,...rep.main.csv].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+t],{type:'text/csv'}));a.download='report-'+now().date+'.csv';a.click()}
V.set=()=>{const c=S.cfg||{},ad=isAdmin();$('#v').innerHTML=`<h2>Settings</h2><div class=card><div class=s>Signed in as</div><b>${esc(S.name||'-')}</b> <span class=s>(${ad?'admin':'treasurer'})</span><div class=s style="margin-top:10px">Connected to</div><div style="word-break:break-all">${esc(S.url)}</div><div class=s style="margin-top:8px">Unsynced items: ${S.pend.length+S.pendx.length}</div><div class=s style="margin-top:8px;color:var(--r)">${esc(S.err||'')}</div><button class=btn onclick="load().then(()=>{render();toast(S.err||'Synced',!!S.err)})">Sync now</button><button class="btn d" onclick="logout()">Sign out</button></div><div class=card><b>Payment accounts</b><div class=s>Shown when recording GCash or bank payments.</div>${ad?`${fld('gn','GCash account name',c.gcash_name||'')}${fld('gx','GCash number',c.gcash_no||'')}${fld('bk','Bank name, account name and number',c.bank||'')}<button class=btn onclick=saveCfg()>Save accounts</button>`:`<div class=s style="margin-top:8px">GCash: ${esc(c.gcash_no||'-')} ${esc(c.gcash_name||'')}<br>Bank: ${esc(c.bank||'-')}</div>`}</div><div class=card><b>App lock</b><div class=s>Ask for a 4-digit PIN when KOLEKTA is opened, or when you come back after 2 minutes away. Keeps casual snoopers out of this phone's treasurer session.</div>${lockOn()?'<button class="btn s2" onclick=pinChange()>Change PIN</button><button class="btn d" onclick=pinOff()>Turn off PIN</button>':'<button class="btn a" onclick=pinSet()>Set PIN</button>'}</div><div class=card><b>Install app</b><div class=s>Add KOLEKTA to your homescreen so it opens like a normal app.</div><div class=ib data-k=set></div></div>`};
async function saveCfg(){const cfg={gcash_name:fv('gn'),gcash_no:fv('gx'),bank:fv('bk')};try{await api('setcfg',{cfg});S.cfg=cfg;save();done('Payment accounts saved')}catch(e){toast('Could not save. Go online and retry.',1)}}
addEventListener('online',flush);setInterval(()=>S.tok&&(S.pend.length||S.pendx.length)&&flush(),20000);
// ---- Install app from inside KOLEKTA ----
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;ibtn()});
addEventListener('appinstalled',()=>{dip=null;ibtn();done('KOLEKTA installed')});
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
async function installApp(){if(!dip)return howto();dip.prompt();try{const r=await dip.userChoice;if(r.outcome==='accepted')toast('Installing KOLEKTA...')}catch(e){}dip=null;ibtn()}
function howto(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);modal(`<h2>Install KOLEKTA</h2>${ios?'<div class=card>1. Open this page in <b>Safari</b>.<br>2. Tap the <b>Share</b> button.<br>3. Choose <b>Add to Home Screen</b>.</div>':'<div class=card>1. Tap the <b>⋮</b> menu at the top right of Chrome.<br>2. Choose <b>Install app</b> (or <b>Add to Home screen</b>).<br>3. Tap <b>Install</b>.</div><div class=s>If it says "already installed" but the icon is gone, uninstall the old KOLEKTA in Android Settings > Apps, then reopen this page.</div>'}<button class="btn s2" onclick=closeM()>Close</button>`)}
function ibtn(){const app=isApp();document.querySelectorAll('.ib').forEach(el=>{const k=el.dataset.k;el.innerHTML=app?(k==='set'?'<div class=s style="margin-top:8px">KOLEKTA is installed on this phone.</div>':''):k==='dash'?(dip&&!S.noib?`<div class=card><div class=row><div><b>Install KOLEKTA</b><div class=s>Open it from your homescreen like a normal app.</div></div><button class=btn style="width:auto;padding:9px 18px;margin:0" onclick=installApp()>Install</button></div><div class=s style="margin-top:8px" onclick="S.noib=1;ibtn()">Not now</div></div>`:''):`<button class="btn ${k==='set'?'a':'s2'}" onclick=installApp()>${k==='set'?'Install app':'Install app on this phone'}</button>`})}

// ================= 1. Reminders =================
const first=n=>{const t=String(n||'').trim(),p=t.includes(',')?t.split(',')[1].trim():t;return p.split(/\s+/)[0]||t};
function remMsg(s,b){const c=R.col?S.co.find(x=>x.id===R.col):null,cf=S.cfg||{},due=c&&c.deadline?' Deadline: '+c.deadline+'.':'',pay=[cf.gcash_no?'GCash '+cf.gcash_no+(cf.gcash_name?' ('+cf.gcash_name+')':''):'',cf.bank||''].filter(Boolean).join(' / ');
return`Hi ${first(s.name)}! Paalala lang po para sa class fund${c?' ('+c.name+')':''}. May balance ka pa na ${money(b.rem)}.${due}${pay?' Pwede magbayad via '+pay+' o cash sa treasurer.':' Pwede magbayad sa treasurer.'} Salamat!`}
function remind(){const l=rep.list.filter(x=>x.b.rem>0).sort((a,b)=>b.b.rem-a.b.rem);S.rl=l;
modal(`<h2>Send reminders</h2><div class=s>${l.length} student${l.length===1?'':'s'} with a balance. Tap Send, then pick Messenger, SMS or any app.</div><button class="btn a" onclick=remAll()>Group chat reminder (names only)</button><div style="margin-top:8px">${l.map((x,i)=>`<div class="card li"><div class=av>${esc(ini(x.s.name))}</div><div class=m><b>${esc(x.s.name)}</b><div class=s>${money(x.b.rem)} left</div></div><div class=r style="display:flex;gap:6px"><button class="btn s2" style="width:auto;padding:7px 14px;margin:0" onclick="remOne(${i})">Send</button>${x.s.email?`<button class="btn s2" style="width:auto;padding:7px 14px;margin:0" onclick="remMail(${i})">Email</button>`:''}</div></div>`).join('')}</div><button class="btn s2" onclick=closeM()>Close</button>`)}
function sendTxt(t,title){navigator.share?navigator.share({title:title||'KOLEKTA',text:t}).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>done('Message copied'))}
function remOne(i){const x=S.rl[i];sendTxt(remMsg(x.s,x.b),'Class fund reminder')}
function remMail(i){const x=S.rl[i];location.href='mailto:'+encodeURIComponent(x.s.email)+'?subject='+encodeURIComponent('Class fund reminder')+'&body='+encodeURIComponent(remMsg(x.s,x.b))}
function remAll(){const c=R.col?S.co.find(x=>x.id===R.col):null;sendTxt(`Class fund reminder${c?' - '+c.name:''} (${now().date})\nMay natitirang balance pa po sina:\n`+S.rl.map((x,i)=>(i+1)+'. '+x.s.name).join('\n')+`\nPaki-settle po sa treasurer. Salamat!`,'Class fund reminder')}

// ================= 2. Fund summary (share) =================
function fundData(){const E=allEx().filter(e=>e.status!=='VOID').slice().sort((a,b)=>(a.date+a.time)<(b.date+b.time)?1:-1),bs=S.st.map(s=>bal(s)),ex=sum(bs,b=>b.exp),pd=sum(bs,b=>b.paid);return{col:collected(),sp:spent(),fund:fund(),E,pc:ex?Math.min(100,pd/ex*100):0}}
function fundSum(){const d=fundData();modal(`<h2>Class fund summary</h2><div class=s>As of ${now().date}. Totals and expenses only. No student names or balances are included.</div><div class=card style="margin-top:10px"><div class=s>Fund balance</div><div class=n ${d.fund<0?'style="color:var(--r)"':''}>${money(d.fund)}</div><div class=s style="margin-top:6px">${money(d.col)} collected \u2212 ${money(d.sp)} spent \u2022 ${d.pc.toFixed(0)}% of expected collected</div></div><div class=card><b>Expenses</b>${d.E.slice(0,10).map(e=>`<div class=row style="margin-top:10px"><span>${esc(e.title)}<div class=s>${esc(e.category)} \u2022 ${esc(e.date)}</div></span><b>\u2212${money(e.amount)}</b></div>`).join('')||'<div class=s style="margin-top:8px">No expenses yet.</div>'}${d.E.length>10?`<div class=s style="margin-top:10px">+${d.E.length-10} more in the shared image/text</div>`:''}</div><button class="btn a" onclick=shareFundImg()>Share as image</button><button class="btn s2" onclick=shareFundTxt()>Share as text</button><button class="btn s2" onclick=closeM()>Close</button>`)}
function shareFundTxt(){const d=fundData();sendTxt(`KOLEKTA - Class fund summary (${now().date})\nCollected: ${money(d.col)}\nSpent: ${money(d.sp)}\nBalance: ${money(d.fund)}\n\nExpenses:\n`+(d.E.map(e=>`\u2022 ${e.date} - ${e.title} - ${money(e.amount)}`).join('\n')||'None yet'),'Class fund summary')}
function fundImg(){const d=fundData(),E=d.E.slice(0,12),more=d.E.length-E.length,W=1080,H=770+(E.length?E.length*84:80)+(more>0?56:0)+100,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d'),F='"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
const T=(t,a,b,sz,w,c,al)=>{x.font=w+' '+sz+'px '+F;x.fillStyle=c;x.textAlign=al||'left';x.fillText(t,a,b)};
const fit=(t,sz,w,max)=>{t=String(t);x.font=w+' '+sz+'px '+F;if(x.measureText(t).width<=max)return t;while(t.length>1&&x.measureText(t+'\u2026').width>max)t=t.slice(0,-1);return t+'\u2026'};
x.fillStyle='#eef1ea';x.fillRect(0,0,W,H);x.fillStyle='#0a2e22';x.fillRect(0,0,W,210);
T('KOLEKTA',64,100,56,800,'#ffffff');T('Class fund summary \u2022 '+now().date,64,156,30,600,'#c8f169');
x.fillStyle='#ffffff';rr(48,240,984,300,36);x.fill();
T('Fund balance',88,305,32,600,'#6b7a70');T(money(d.fund),88,415,100,800,d.fund<0?'#ef5b3b':'#0d1b14');T(money(d.col)+' collected  \u2212  '+money(d.sp)+' spent',88,490,30,600,'#6b7a70');
T('Collected of expected',64,605,30,700,'#0d1b14');T(d.pc.toFixed(0)+'%',1016,605,30,800,'#0d1b14','right');
x.fillStyle='#e1e7dc';rr(64,625,952,24,12);x.fill();if(d.pc>0){x.fillStyle='#17a05a';rr(64,625,Math.max(24,952*d.pc/100),24,12);x.fill()}
T('Expenses',64,730,42,800,'#0d1b14');let y=770;
if(!E.length)T('No expenses yet',64,y+40,30,600,'#6b7a70');
E.forEach(e=>{T(fit(e.title,32,700,700),64,y+34,32,700,'#0d1b14');T('\u2212'+money(e.amount),1016,y+34,32,800,'#0d1b14','right');T(fit(e.category+' \u2022 '+e.date,26,500,900),64,y+68,26,500,'#6b7a70');x.fillStyle='#e1e7dc';x.fillRect(64,y+82,952,2);y+=84});
if(more>0)T('+'+more+' more expenses',64,y+36,26,600,'#6b7a70');
T('Made with KOLEKTA',W/2,H-40,24,600,'#6b7a70','center');return cv}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
async function shareFundImg(){busy('Preparing image...');try{try{await document.fonts.load('800 40px "Plus Jakarta Sans"')}catch(e){}const cv=fundImg(),b=await new Promise(r=>cv.toBlob(r,'image/png')),f=new File([b],'class-fund-'+now().date+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Class fund summary'});else dl(b,f.name)}catch(e){if(!e||e.name!=='AbortError')toast('Could not make the image',1)}finally{idle()}}

// ================= 3. PIN lock =================
const lockOn=()=>!!L('pinh');
const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
const pinHash=async(p,salt)=>hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+p)));
function pad(title,sub,chk,ok,cn){const el=$('#lk');let v='',msg=sub||'',wait=0;
const draw=()=>{el.innerHTML=`<div class=lkc><img class=lg style="width:56px;height:56px;border-radius:16px" src=icon-192.png alt=""><h2>${esc(title)}</h2><div class="lke">${esc(msg)}</div><div class=dots>${[0,1,2,3].map(i=>`<i class="${i<v.length?'f':''}"></i>`).join('')}</div><div class=keys>${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k=${n}>${n}</button>`).join('')}<button class=sm ${cn?'data-k=x':'disabled'}>${cn?'Cancel':''}</button><button data-k=0>0</button><button class=sm data-k=b aria-label=Backspace>\u232B</button></div>${cn?'':'<div class=s style="margin-top:18px" onclick="lkForgot()">Forgot PIN? Sign out</div>'}</div>`};
el.className='on';draw();
el.onclick=async e=>{const b=e.target.closest('button');if(!b||wait||b.disabled)return;const k=b.dataset.k;if(k==='x'){el.className='';el.innerHTML='';return}if(k==='b')v=v.slice(0,-1);else if(v.length<4)v+=k;
if(v.length===4){wait=1;draw();const r=await chk(v);wait=0;if(r){msg=r;v='';navigator.vibrate&&navigator.vibrate([60,40,60])}else{el.className='';el.innerHTML='';ok&&ok(v);return}}draw()}}
let lkErr=0,lkBlock=0,lkAway=0;
function lockUnlock(){if(!lockOn())return;pad('Enter PIN','',async p=>{if(Date.now()<lkBlock)return 'Too many tries. Wait a moment.';if(await pinHash(p,L('pins'))===L('pinh')){lkErr=0;return ''}if(++lkErr>=5){lkErr=0;lkBlock=Date.now()+30000;return 'Too many tries. Wait 30 seconds.'}return 'Wrong PIN'},0,0)}
function pinSet(){if(!(window.crypto&&crypto.subtle))return toast('PIN lock needs a secure (https) page',1);
pad('Create a PIN','Choose 4 digits',()=>'',a=>setTimeout(()=>pad('Confirm PIN','Enter the same PIN again',b=>b===a?'':'Does not match. Try again.',async b=>{const sl=Array.from(crypto.getRandomValues(new Uint8Array(8)),n=>n.toString(16)).join('');W('pins',sl);W('pinh',await pinHash(b,sl));done('PIN lock is on');render()},1),50),1)}
function pinCheck(then){pad('Enter current PIN','',async p=>(await pinHash(p,L('pins'))===L('pinh'))?'':'Wrong PIN',then,1)}
function pinOff(){pinCheck(()=>{try{localStorage.removeItem('pinh');localStorage.removeItem('pins')}catch(e){}done('PIN lock is off');render()})}
function pinChange(){pinCheck(()=>setTimeout(pinSet,50))}
function lkForgot(){if(!confirm('Sign out and remove the PIN? Unsynced items stay on this phone until you sign in again.'))return;try{localStorage.removeItem('pinh');localStorage.removeItem('pins')}catch(e){}const el=$('#lk');el.className='';el.innerHTML='';logout()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){lkAway=Date.now();return}if(S.tok&&lockOn()&&lkAway&&Date.now()-lkAway>120000&&$('#lk').className!=='on')lockUnlock()});

// ================= 4. Import class list =================
const csvLine=l=>{const o=[];let c='',q=0;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o};
function parseList(t){const rows=[];String(t).split(/\r?\n/).forEach(l=>{if(!l.trim())return;const c=(l.includes('\t')?l.split('\t'):l.includes(';')?l.split(';'):l.includes('|')?l.split('|'):csvLine(l)).map(x=>x.trim().replace(/^"|"$/g,'').trim());while(c.length>1&&!c[c.length-1])c.pop();rows.push(c)});return rows}
function impForm(){modal(`<h2>Import class list</h2><div class=s>One student per line: <b>ID, Name, Section</b> (email is optional). Copying the columns straight from Excel or Google Sheets works best.</div><label>Class list<textarea id=f_il rows=8 placeholder="2025010656, Manota, Lester R, BSIT-1A"></textarea></label>${fld('is','Section for lines that have none',S.lsec||'')}<button class=btn onclick=impPrev()>Preview</button><button class="btn s2" onclick=closeM()>Cancel</button>`)}
function impPrev(){const def=fv('is'),seen=new Set(S.st.map(x=>String(x.id))),ok=[],skip=[],bad=[];
parseList(fv('il')).forEach((c,i)=>{if(i===0&&/^(student\s*)?(id|no\.?|number)$/i.test(c[0]))return;const id=(c[0]||'').trim();let em='';if(c.length>2&&/@/.test(c[c.length-1]))em=c.pop().trim();const sec=(c.length>=3?c[c.length-1]:'').trim()||def,name=c.slice(1,c.length>=3?-1:c.length).join(', ').trim();
if(!id||!name||!sec||(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)))return bad.push(c.join(' | '));if(seen.has(id))return skip.push(name);seen.add(id);ok.push({id,name,section:sec,email:em})});
S.imp=ok;modal(`<h2>Preview</h2><div class=g2><div class=card><div class=s>Will add</div><b>${ok.length}</b></div><div class=card><div class=s>Already registered</div><b>${skip.length}</b></div></div>${ok.slice(0,6).map(r=>`<div class=row style="margin:6px 0"><span>${esc(r.name)}<div class=s>${esc(r.id)} \u2022 ${esc(r.section)}</div></span></div>`).join('')}${ok.length>6?`<div class=s>+${ok.length-6} more</div>`:''}${bad.length?`<div class=card style="margin-top:10px"><b style="color:var(--r)">${bad.length} line${bad.length===1?'':'s'} skipped</b><div class=s>Missing ID, name or section:<br>${bad.slice(0,5).map(esc).join('<br>')}</div></div>`:''}<div class=s style="margin:10px 0">Imported students can be scanned right away with their school ID. Matching uses the ID number.</div><button class="btn a" ${ok.length?'':'disabled'} onclick=impGo()>Import ${ok.length} student${ok.length===1?'':'s'}</button><button class="btn s2" onclick=impForm()>Back</button>`)}
async function impGo(){const l=S.imp||[];if(!l.length)return;if(!navigator.onLine)return toast('Go online to import',1);let n=0;
modal(`<div class=ctr><div class=s style="padding:30px 0"><i class=spin style="margin-right:10px"></i><span id=ipn>Saving 0 of ${l.length}...</span></div></div>`);
try{for(const r of l){let qr;do{qr='SCM-'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(36).padStart(2,'0')).join('')}while(S.st.some(x=>x.qr===qr));await api('upsert',{sheet:'Students',row:{id:r.id,name:r.name,section:r.section,email:r.email,qr,created:now().date}},1);n++;const t=$('#ipn');if(t)t.textContent='Saving '+n+' of '+l.length+'...'}}
catch(e){await load();closeM();render();return toast('Stopped after '+n+' of '+l.length+'. Import again to continue.',1)}
await load();closeM();render();done('Import finished',n+' students added')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(S.tok&&lockOn())lockUnlock();
boot();
</script></body></html>

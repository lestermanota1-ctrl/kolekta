j.method==='Cash'?record(s,{},man):refForm(s,man)}
function refForm(s,man){const j=S.job,c=S.co.find(x=>x.id===j.cid);S.proof='';modal(`<h2>${esc(s.name)}</h2><div class=s>${esc(j.method)} • ${money(j.amt)} • ${esc(c.name)}</div><div id=rq class=ctr></div><label>${j.method==='GCash'?'GCash reference no.':'Bank reference / transaction no.'}<input id=f_ref autocomplete=off placeholder="${j.method==='GCash'?'13-digit reference':'Reference no.'}"></label><label>Screenshot of the payment (optional)<input id=f_pf type=file accept="image/*" onchange="pickProof(this)"></label><div id=pv></div><button class="btn a" onclick="confirmRef('${esc(s.id)}',${man?1:0})">Record payment</button><button class="btn s2" onclick="closeM();locked=false">Cancel</button>`);qrFill(j.method)}
function shrink(f,max,q){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const r=Math.min(1,(max||900)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q||.6))};im.onerror=()=>no();im.src=u})}
async function pickProof(i){const f=i.files[0];if(!f)return;S.proof='';S.prep=1;$('#pv').innerHTML='<div class=s style="padding:10px 0"><i class=spin style="margin-right:10px"></i>Preparing photo...</div>';try{S.proof=await shrink(f);$('#pv').innerHTML=`<img class=pvimg src="${S.proof}" alt="Preview">`}catch(e){S.proof='';$('#pv').innerHTML='';toast('Could not read that image',1)}S.prep=0}
function confirmRef(id,man){if(S.prep)return toast('Photo is still preparing',1);const ref=fv('ref').toUpperCase();if(!ref)return toast('Enter the reference number',1);const d=allTx().find(t=>t.status!=='VOID'&&t.ref&&String(t.ref).toUpperCase()===ref);if(d&&!confirm('Reference '+ref+' was already used for '+d.name+' ('+d.txid+'). Record anyway?'))return;const s=S.st.find(x=>x.id===id);record(s,{ref,proofData:S.proof},man)}
function record(s,x,man){const j=S.job,cid=j.cid,amt=j.amt;S.last[s.id+'|'+cid]=Date.now();const c=S.co.find(y=>y.id===cid),n=now(),id='TX'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
const t={txid:id,clientId:crypto.randomUUID?crypto.randomUUID():id+Math.random(),studentId:s.id,name:s.name,section:s.section,collId:cid,collection:c.name,amount:amt,date:n.date,time:n.time,by:S.name||'admin',status:'VALID',payStatus:'',note:man?'Selected manually':'',method:j.method,ref:x.ref||'',proof:'',emailReceipt:j.em};if(x.proofData)t.proofData=x.proofData;
S.pend.push(t);t.payStatus=bal(s,cid).st;if(!W('pend',S.pend)){S.pend.pop();toast('Phone storage is full. Sync first, then try again.',1);locked=false;return}
setSync(1);flush();const b=bal(s),ov=$('#so').classList.contains('on');navigator.vibrate&&navigator.vibrate(150);S.proof='';
modal(`<div class=ctr><svg class=okm viewBox="0 0 64 64" aria-hidden="true"><circle cx=32 cy=32 r=30 /><path d="M19 33l9 9 17-19"/></svg><div class=n style="color:var(--g)">Payment recorded</div><h2>${esc(s.name)}</h2><div class=s>${esc(s.id)} • ${esc(s.section)}</div>${navigator.onLine?'':'<div class=s style="margin-top:6px">Saved on this phone. It will sync when you are online.</div>'}</div><div class=card style="margin-top:10px"><div class=row><span>Amount</span><b>${money(amt)}</b></div><div class=row><span>Method</span><b>${esc(j.method)}</b></div>${t.ref?`<div class=row><span>Reference</span><b>${esc(t.ref)}</b></div>`:''}<div class=row><span>Collection</span><b>${esc(c.name)}</b></div><div class=row><span>Transaction</span><b>${id}</b></div><div class=row><span>Date</span><b>${n.date} ${n.time}</b></div><div class=row><span>Balance</span><b>${money(b.rem)} ${badge(b.st)}</b></div></div><button class=btn onclick="shareR('${id}')">Share receipt</button><button class="btn s2" onclick="shareRI('${id}')">Receipt image</button>${ov?`<button class="btn a" onclick="closeM();locked=false">Scan next student</button>`:`<button class="btn a" onclick="chooser()">Choose next student</button>`}<button class="btn s2" onclick="closeM();endScan()">Done</button>`)}
function shareR(id){const t=allTx().find(x=>x.txid===id),x=`RECEIPT ${t.receipt||t.txid}\n${t.name} (${t.studentId})\n${t.collection}: ${money(t.amount)}${t.method&&t.method!=='Cash'?'\n'+t.method+(t.ref?' ref '+t.ref:''):''}\n${t.date} ${t.time}`;navigator.share?navigator.share({title:'Payment receipt',text:x}).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(x).then(()=>done('Receipt copied'))}
// ---- Students ----
let fq='',fs='',fst='',fcol='';
V.stu=()=>{const secs=[...new Set(S.st.map(s=>s.section))].sort();$('#v').innerHTML=`<div class=row><h2>Students</h2><button class=btn style="width:auto;padding:8px 16px" onclick="S.fast=0;sForm()">+ Add</button></div><div class=chips><button class=chip onclick="S.regN=0;scanQR('',1)">\u26A1 Fast register</button><button class=chip onclick=chkScan()>\u{1F50D} Check balance</button><button class=chip onclick=impForm()>\u2B06\uFE0F Import list</button></div><input id=q placeholder="Search name or ID" value="${esc(fq)}" oninput="fq=this.value;sl()"><div class=g2 style="margin-top:8px"><select onchange="fs=this.value;sl()"><option value="">All sections</option>${secs.map(x=>`<option ${x===fs?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="fst=this.value;sl()"><option value="">All status</option>${['PAID','PARTIAL','UNPAID','OVERPAID'].map(x=>`<option ${x===fst?'selected':''}>${x}</option>`).join('')}</select></div><select onchange="fcol=this.value;sl()" style="margin-bottom:10px"><option value="">All collections</option>${S.co.map(c=>`<option value="${esc(c.id)}" ${c.id===fcol?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div id=sl></div>`;sl()};
function sl(){const q=fq.toLowerCase();$('#sl').innerHTML=S.st.filter(s=>(!q||s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q))&&(!fs||s.section===fs)).map(s=>({s,b:bal(s,fcol)})).filter(x=>!fst||x.b.st===fst).map(({s,b})=>`<div class="card li" data-id="${esc(s.id)}" onclick="prof(this.dataset.id)"><div class=av>${esc(ini(s.name))}</div><div class=m><b>${esc(s.name)}</b><div class=s>${esc(s.id)} • ${esc(s.section)}</div><div class=pb style="margin-top:7px"><i style="width:${b.exp?Math.min(100,b.paid/b.exp*100):0}%"></i></div></div><div class=r><b>${money(b.paid)}</b>${badge(b.st)}</div></div>`).join('')||'<div class=s>No students match. Tap Add to register one.</div>'}
function qrUrl(t){const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount(),z=10,m=2,c=document.createElement('canvas');c.width=c.height=(n+2*m)*z;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*z,(r+m)*z,z,z);return c.toDataURL('image/png')}
function prof(id){const s=S.st.find(x=>x.id===id),b=bal(s),h=allTx().filter(t=>t.studentId===id).reverse();
modal(`<h2>${esc(s.name)}</h2><div class=s>${esc(s.id)} \u2022 ${esc(s.section)}</div><div class=ctr><img src="${qrUrl(s.qr)}" width=200 height=200 alt="QR"><a class="btn s2" style="text-decoration:none" download="QR-${esc(s.id)}.png" href="${qrUrl(s.qr)}">Download QR</a></div><div class=card>Expected ${money(b.exp)}<br>Paid ${money(b.paid)}<br>Remaining ${money(b.rem)} ${badge(b.st)}${collLines(s)}</div><button class="btn s2" onclick="stmt('${esc(id)}')">Statement (share / print)</button><b>History</b>${h.map(t=>`<div class=row style="margin:6px 0"><span>${esc(t.collection)}<div class=s>${t.date} ${t.time} \u2022 ${t.txid}</div></span><b class="${t.status==='VOID'?'VOID bd':''}">${money(t.amount)}</b></div>`).join('')||'<div class=s>No payments yet</div>'}<button class=btn onclick="sForm('${esc(id)}')">Edit</button>${isAdmin()?`<button class="btn d" onclick="delS('${esc(id)}')">Remove student</button>`:''}<button class="btn a" onclick=closeM()>Close</button>`)}
function sForm(id,keep){const s=keep&&S.draft?S.draft:(S.st.find(x=>x.id===id)||{id:'',name:'',section:S.lsec||'',qr:''});modal(`<h2>${id?'Edit':'Add'} student</h2>${fld('id','Student ID',s.id)}${fld('name','Full name',s.name)}${fld('sec','Section',s.section)}<label>Email for receipts (optional)<input id=f_em type=email inputmode=email value="${esc(s.email||'')}" placeholder="name@gmail.com"></label><label>ID card QR code<input id=f_qr value="${esc(s.qr||'')}" placeholder="Scan the QR on the student's ID"></label><button class="btn a" onclick="scanQR('${esc(id||'')}')">Scan the QR on the ID</button><div class=s>Leave blank to make a new QR instead.</div><button class=btn onclick="saveS('${esc(id||'')}')">Save student</button>${S.fast?'<button class="btn s2" onclick=endFast()>Stop fast register</button>':''}`)}
let qs=null,qt=null;
function stopQ(){clearTimeout(qt);if(qs)qs.getTracks().forEach(t=>t.stop());qs=null}
function scanQR(old,fast){S.chk=0;S.fast=fast?1:0;S.draft=fast?{id:'',name:'',section:S.lsec||'',qr:'',email:''}:{id:fv('id'),name:fv('name'),section:fv('sec'),qr:fv('qr'),email:fv('em')};
modal(`<h2>${S.fast?'Fast register':"Scan the student's ID"}</h2>${S.fast?`<div class=s style="margin-bottom:8px">${S.regN||0} registered this session \u2022 Section: <b>${esc(S.lsec||'-')}</b></div>`:''}<div class=vf><video id=cv playsinline muted></video><i></i></div><button class="btn s2" onclick="stopQ();${S.fast?'endFast()':`sForm('${esc(old)}',1)`}">${S.fast?'Done':'Cancel'}</button>`);startQ(old)}
function endFast(){S.fast=0;closeM();render()}
async function startQ(old){beepInit();try{qs=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('#cv');v.srcObject=qs;await v.play();const det=window.BarcodeDetector?new BarcodeDetector({formats:['qr_code']}):null;const loop=async()=>{if(!qs)return;let val;try{if(det){const r=await det.detect(v);val=r[0]&&r[0].rawValue}else{const cv=document.createElement('canvas');cv.width=v.videoWidth;cv.height=v.videoHeight;const x=cv.getContext('2d');x.drawImage(v,0,0);const d=x.getImageData(0,0,cv.width,cv.height);const q=jsQR(d.data,d.width,d.height);val=q&&q.data}}catch(e){}if(val){if(S.chk){const x=findQr(val);if(x){beep();stopQ();S.chk=0;closeM();prof(x.id)}else{beep('bad');toast('This ID is not registered',1);qt=setTimeout(loop,1500)}return}const p=parseId(val),ex=findQr(val);
if(ex&&ex.id!==old){beep('bad');navigator.vibrate&&navigator.vibrate([80,60,80]);toast(ex.name+' is already registered',1);if(S.fast){qt=setTimeout(loop,1500);return}stopQ();sForm(old,1);return}
beep();stopQ();navigator.vibrate&&navigator.vibrate(100);S.draft.qr=val;if(p&&!old){S.draft.id=p.id;if(p.name)S.draft.name=p.name}sForm(old,1);done(p&&!old?'ID scanned':'QR captured');return}qt=setTimeout(loop,250)};loop()}catch(e){toast('Camera blocked. Allow camera access.',1);sForm(old,1)}}
async function saveS(old){const id=fv('id'),name=fv('name'),sec=fv('sec'),em=fv('em');if(!id||!name||!sec)return toast('Fill in all fields',1);if(old&&old!==id&&!isAdmin())return toast('Only the admin can change a student ID',1);if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return toast('Enter a valid email address',1);if(id!==old&&S.st.some(x=>x.id===id))return toast('Student ID already exists',1);const dup=S.st.find(x=>x.id!==old&&nk(x.name)===nk(name));if(dup&&!confirm(dup.name+' ('+dup.id+') is already registered with the same name. Save anyway?'))return;
const o=S.st.find(x=>x.id===old);let qr=fv('qr')||(o?o.qr:'');if(S.st.some(x=>x.qr===qr&&x.id!==old))return toast('This QR is already registered to another student',1);if(!qr){do{qr='SCM-'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(36).padStart(2,'0')).join('')}while(S.st.some(x=>x.qr===qr))}
try{if(old&&old!==id)await api('delete',{id:old});await api('upsert',{sheet:'Students',row:{id,name,section:sec,email:em,qr,created:o?o.created:now().date}});await load();closeM();render();S.lsec=sec;done('Student saved',name);if(S.fast&&!old){S.regN=(S.regN||0)+1;setTimeout(()=>scanQR('',1),700)}}catch(e){toast('Could not save. Go online and retry.',1)}}
async function delS(id){if(!confirm('Remove this student? Past transactions stay in the sheet.'))return;try{await api('delete',{id});await load();closeM();render();done('Student removed')}catch(e){toast('Could not remove',1)}}
// ---- Collections ----
V.col=()=>{$('#v').innerHTML=`<div class=row><h2>Collections</h2><button class=btn style="width:auto;padding:8px 16px" onclick="cForm()">+ New</button></div>`+(S.co.map(c=>`<div class=card data-id="${esc(c.id)}" onclick="cForm(this.dataset.id)"><div class=row><b>${esc(c.name)}</b><span class="bd ${c.status==='CLOSED'?'VOID':'PAID'}">${esc(c.status)}</span></div><div class=s>${Number(c.amount)?money(c.amount)+(c.frequency==='weekly'?' per week \u2022 '+times(c)+' wk due':''):'Flexible amount'} \u2022 ${esc(c.section||'All sections')} \u2022 Due ${esc(c.deadline||'-')}<br>${esc(c.description)}</div></div>`).join('')||'<div class=s>No collections yet. Tap New to create one.</div>')};
function cForm(id){const c=S.co.find(x=>x.id===id)||{name:'',description:'',amount:'',start:now().date,deadline:'',section:'',status:'ACTIVE',frequency:'once'};modal(`<h2>${id?'Edit':'New'} collection</h2>${fld('n','Name',c.name)}${fld('d','Description',c.description)}<label>How often<select id=f_fr><option value=once>One-time</option><option value=weekly ${c.frequency==='weekly'?'selected':''}>Every week</option></select></label>${fld('a','Amount (per week if weekly, 0 = flexible)',c.amount,'number')}${fld('s','Start date',c.start,'date')}${fld('e','Payment deadline',c.deadline,'date')}${fld('sec','Section (blank = all students)',c.section)}<label>Status<select id=f_st><option>ACTIVE</option><option ${c.status==='CLOSED'?'selected':''}>CLOSED</option></select></label><button class=btn onclick="saveC('${esc(id||'')}')">Save collection</button>${id&&isAdmin()?`<button class="btn d" onclick="delC('${esc(id)}')">Delete collection</button>`:''}`)}
async function delC(id){const c=S.co.find(x=>x.id===id),n=allTx().filter(t=>t.collId===id&&t.status!=='VOID').length;if(!confirm('Delete "'+c.name+'"?'+(n?' It has '+n+' payments. They stay in Transactions but will no longer count toward balances. To keep them, set it to CLOSED instead.':'')))return;try{await api('delete',{sheet:'Collections',id});await load();closeM();render();done('Collection deleted')}catch(e){toast('Could not delete. Check connection.',1)}}
async function saveC(id){const name=fv('n');if(!name)return toast('Name is required',1);const a=Number(fv('a')||0);if(a<0)return toast('Invalid amount',1);try{await api('upsert',{sheet:'Collections',row:{id:id||'C'+Date.now().toString(36).toUpperCase(),name,description:fv('d'),amount:a,start:fv('s'),deadline:fv('e'),section:fv('sec'),status:$('#f_st').value,frequency:$('#f_fr').value}});await load();closeM();render();done('Collection saved',name)}catch(e){toast('Could not save. Go online and retry.',1)}}
// ---- Transactions ----
let tq='',tf={from:'',to:'',method:'',col:''};
V.tx=()=>{const o=(a,k)=>a.map(x=>`<option value="${esc(x[0])}" ${tf[k]===x[0]?'selected':''}>${esc(x[1])}</option>`).join('');$('#v').innerHTML=`<h2>Transactions</h2><input placeholder="Search name, ID or transaction" value="${esc(tq)}" oninput="tq=this.value;tl()"><div class=g2 style="margin-top:8px"><label style="margin:0">From<input type=date value="${tf.from}" onchange="tf.from=this.value;tl()"></label><label style="margin:0">To<input type=date value="${tf.to}" onchange="tf.to=this.value;tl()"></label></div><div class=g2><select onchange="tf.method=this.value;tl()"><option value="">All methods</option>${o(METH.map(m=>[m,m]),'method')}</select><select onchange="tf.col=this.value;tl()"><option value="">All collections</option>${o(S.co.map(c=>[c.id,c.name]),'col')}</select></div><div id=ts class=s style="margin-top:8px"></div><div id=tl style="margin-top:10px"></div>`;tl()};
function tl(){const q=tq.toLowerCase(),l=allTx().slice().reverse().filter(t=>(!q||(t.name+t.studentId+t.txid+(t.receipt||'')+t.collection+t.date).toLowerCase().includes(q))&&(!tf.from||t.date>=tf.from)&&(!tf.to||t.date<=tf.to)&&(!tf.method||(t.method||'Cash')===tf.method)&&(!tf.col||t.collId===tf.col));$('#ts').textContent=l.length+' payments \u2022 '+money(sum(l.filter(t=>t.status!=='VOID'),t=>Number(t.amount)));$('#tl').innerHTML=l.slice(0,100).map(t=>`<div class=card data-id="${t.txid}" onclick="txd(this.dataset.id)"><div class=row><b>${esc(t.name)}</b><b>${money(t.amount)}</b></div><div class=s>${esc(t.collection)} \u2022 ${t.date} ${t.time}${t.method&&t.method!=='Cash'?' \u2022 '+esc(t.method):''} ${t.status==='VOID'?badge('VOID'):''}</div></div>`).join('')||'<div class=s>No transactions found</div>'}
function txd(id){const t=allTx().find(x=>x.txid===id),pend=S.pend.some(p=>p.txid===id);modal(`<h2>${esc(t.receipt||t.txid)}</h2><div class=card>${esc(t.name)} (${esc(t.studentId)}), ${esc(t.section)}<br>${esc(t.collection)}: <b>${money(t.amount)}</b><br>${t.date} ${t.time} by ${esc(t.by)}<br>${esc(t.method||'Cash')}${t.ref?' • Ref '+esc(t.ref):''}<br>${badge(t.status)} ${esc(t.note)}</div><button class="btn s2" onclick="shareR('${t.txid}')">Share receipt</button><button class="btn s2" onclick="shareRI('${t.txid}')">Receipt image</button>${(t.proof||t.proofData)?`<button class="btn s2" onclick="viewProof('t','${t.txid}')">View payment photo</button>`:''}${t.status==='VOID'||!isAdmin()?'':pend?'<div class=s>Syncing. Void after it syncs.</div>':`<button class="btn s2" onclick="editAmt('t','${t.txid}')">Edit amount</button><button class="btn d" onclick="voidTx('${t.txid}')">Void (then re-scan to correct)</button>`}`)}
async function voidTx(id){const r=prompt('Reason for voiding?');if(!r)return;if(!confirm('Void '+id+'? The record stays in the audit log.'))return;try{await api('void',{txid:id,reason:r});await load();closeM();render();done('Payment voided')}catch(e){toast('Void failed. Go online and retry.',1)}}
// ---- Expenses ----
const EXC=['Supplies','Food & drinks','Printing','Activity / event','Donation','Transportation','Other'];
V.exp=()=>{const E=allEx().slice().reverse(),f=fund();$('#v').innerHTML=`<div class=row><h2>Expenses</h2><button class=btn style="width:auto;padding:8px 16px" onclick="eForm()">+ Add</button></div><div class=g2><div class=card><div class=s>Total spent</div><div class=n>${money(spent())}</div></div><div class=card><div class=s>Fund balance</div><div class=n ${f<0?'style="color:var(--r)"':''}>${money(f)}</div></div></div>`+(E.map(e=>`<div class=card data-id="${esc(e.id)}" onclick="exd(this.dataset.id)"><div class=row><b>${esc(e.title)}</b><b>${e.status==='VOID'?'':'−'}${money(e.amount)}</b></div><div class=s>${esc(e.category)} • ${esc(e.date)} • ${esc(e.by)}${(e.proof||e.proofData)?' • Has photo':''} ${e.status==='VOID'?badge('VOID'):''}</div></div>`).join('')||'<div class=s>No expenses yet. Tap Add to record one. It is subtracted from the class fund automatically.</div>')};
function eForm(){S.proof='';modal(`<h2>New expense</h2>${fld('t','What was it for?','')}<label>Amount (₱)<input id=f_a class=amt type=number inputmode=decimal min=0 step=0.01 placeholder="0.00"></label><div class=s>Fund balance now: ${money(fund())}</div><label>Category<select id=f_cat>${EXC.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Paid from<select id=f_src>${METH.map(m=>`<option>${m}</option>`).join('')}</select></label>${fld('d','Date',now().date,'date')}${fld('n','Note (optional)','')}<label>Receipt or proof photo (optional)<input id=f_pf type=file accept="image/*" onchange="pickProof(this)"></label><div id=pv></div><button class="btn a" onclick=saveE()>Save expense</button><button class="btn s2" onclick=closeM()>Cancel</button>`)}
async function saveE(){if(S.prep)return toast('Photo is still preparing',1);const t=fv('t'),a=Number(fv('a'));if(!t)return toast('Describe what it was for',1);if(!(a>0))return toast('Enter a valid amount',1);if(a>fund()&&!confirm('This is more than the fund balance ('+money(fund())+'). Save anyway?'))return;
const n=now(),id='EX'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(),e={id,clientId:crypto.randomUUID?crypto.randomUUID():id+Math.random(),date:fv('d')||n.date,time:n.time,title:t,category:$('#f_cat').value,amount:a,by:S.name||'admin',status:'VALID',proof:'',note:'Paid from: '+$('#f_src').value+'.'+(fv('n')?' '+fv('n'):'')};if(S.proof)e.proofData=S.proof;

const GS_VER='2026-11-14c',GS="// KOLEKTA backend. Paste into Extensions > Apps Script of a Google Sheet.\n// Project Settings > Script properties: add ADMIN_PASS (full access) and TREASURER_PASS (the password the treasurer team shares).\n// Deploy > New deployment > Web app > Execute as: Me, Access: Anyone. Copy the /exec URL.\n// After updating this file: Deploy > Manage deployments > Edit > Version: New version > Deploy.\n// Then run setup() once from the editor and approve the permissions (Drive is new, it stores receipt photos).\nconst H = {\n  Students: ['id','name','section','qr','created','email'],\n  Collections: ['id','name','description','amount','start','deadline','section','status','frequency'],\n  Transactions: ['txid','clientId','studentId','name','section','collId','collection','amount','date','time','by','status','payStatus','note','method','ref','proof','receipt'],\n  Expenses: ['id','clientId','date','time','title','category','amount','by','status','proof','note'],\n  Settings: ['key','value'],\n  'Student Balances': ['id','name','section','expected','paid','balance','status','updated'],\n  Reports: ['note'],\n  'Admin Logs': ['time','user','action','detail']\n};\n// The shared treasurer login can record payments and expenses, but only the admin can do these:\nconst ADMIN_ONLY = ['delete','void','voidexp','setcfg','edittx','editexp','logs','newyear','remcfg','remind','collsheets','saveqr'];\nlet CUR = 'system';   // who is making the current request, written to Admin Logs\nfunction db() {\n  // Works whether the script is attached to a Sheet or standalone.\n  let s = SpreadsheetApp.getActive();\n  if (s) return s;\n  const P = PropertiesService.getScriptProperties(), id = P.getProperty('SHEET_ID');\n  if (id) return SpreadsheetApp.openById(id);\n  s = SpreadsheetApp.create('KOLEKTA Database');\n  P.setProperty('SHEET_ID', s.getId());\n  return s;\n}\nfunction sh(n) {\n  const ss = db();\n  let s = ss.getSheetByName(n);\n  if (!s) {\n    s = ss.insertSheet(n);\n    s.appendRow(H[n]); s.setFrozenRows(1);\n    s.getRange(1, 1, 1, H[n].length).setFontWeight('bold');\n    s.getRange(1, 1, s.getMaxRows(), H[n].length).setNumberFormat('@');\n  } else if (s.getLastColumn() < H[n].length) {   // add newly introduced columns to an older sheet\n    const old = s.getLastColumn();\n    s.getRange(1, old + 1, s.getMaxRows(), H[n].length - old).setNumberFormat('@');\n    s.getRange(1, 1, 1, H[n].length).setValues([H[n]]).setFontWeight('bold');\n  }\n  return s;\n}\nfunction rows(n) {\n  const v = sh(n).getDataRange().getDisplayValues(), h = v.shift();\n  return v.filter(r => r[0] !== '').map(r => Object.fromEntries(h.map((k, i) => [k, r[i]])));\n}\nfunction log(a, d) { sh('Admin Logs').appendRow([new Date().toISOString(), CUR, a, String(d)]); }\nfunction put(n, row) {\n  const s = sh(n), h = H[n], v = s.getDataRange().getValues();\n  const i = v.findIndex((r, k) => k && String(r[0]) === String(row[h[0]]));\n  const a = h.map(k => row[k] == null ? '' : row[k]);\n  if (i > 0) s.getRange(i + 1, 1, 1, h.length).setValues([a]); else s.appendRow(a);\n}\n// Receipt and payment photos live in a private Drive folder. The app fetches them through the API, so nobody needs Drive access.\nfunction folder() {\n  const P = PropertiesService.getScriptProperties(), id = P.getProperty('FOLDER_ID');\n  if (id) { try { return DriveApp.getFolderById(id); } catch (e) {} }\n  const f = DriveApp.createFolder('KOLEKTA Proofs');\n  P.setProperty('FOLDER_ID', f.getId());\n  return f;\n}\nfunction saveImg(d, name) {\n  const m = /^data:(image\\/[a-z+]+);base64,(.+)$/.exec(d);\n  if (!m) throw 'bad image';\n  return folder().createFile(Utilities.newBlob(Utilities.base64Decode(m[2]), m[1], name + '.jpg')).getId();\n}\nfunction testEmail() { MailApp.sendEmail(Session.getActiveUser().getEmail(), 'Test receipt', 'If you can read this, email sending works.'); }\nfunction setup() { Object.keys(H).forEach(sh); folder(); Logger.log(db().getUrl()); }  // run once from the editor to authorize\nfunction doGet() { return ContentService.createTextOutput('KOLEKTA API is running'); }\nfunction doPost(e) {\n  const q = JSON.parse(e.postData.contents), P = PropertiesService.getScriptProperties(), C = CacheService.getScriptCache();\n  let r;\n  try {\n    if (q.action === 'login') {\n      const A = P.getProperty('ADMIN_PASS'), T = P.getProperty('TREASURER_PASS');\n      Utilities.sleep(800);\n      const role = A && q.pass === A ? 'admin' : T && q.pass === T ? 'treasurer' : '';\n      if (!role) throw 'Wrong password';\n      const nm = String(q.name || '').trim().slice(0, 40) || role, t = Utilities.getUuid() + Utilities.getUuid();\n      C.put('t_' + t, JSON.stringify({ r: role, n: nm }), 21600);\n      CUR = nm + ' (' + role + ')'; log('login', '');\n      r = { token: t, role: role, name: nm };\n    } else {\n      const raw = q.token && C.get('t_' + q.token);\n      if (!raw) throw 'auth';\n      let ses; try { ses = JSON.parse(raw); } catch (x) { ses = null; }\n      if (!ses || !ses.r) ses = { r: 'admin', n: 'admin' };   // sessions created before roles existed\n      if (ADMIN_ONLY.includes(q.action) && ses.r !== 'admin') throw 'Only the admin can do that';\n      CUR = ses.n + ' (' + ses.r + ')';\n      const L = LockService.getScriptLock(); L.waitLock(20000);\n      try { r = run(q, ses); } finally { L.releaseLock(); }\n    }\n  } catch (x) { r = { error: String(x) }; }\n  return ContentService.createTextOutput(JSON.stringify(r)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction run(q, ses) {\n  const a = q.action;\n  if (a === 'all') return {\n    students: rows('Students'), collections: rows('Collections'), transactions: rows('Transactions'),\n    expenses: rows('Expenses'), cfg: Object.fromEntries(rows('Settings').map(x => [x.key, x.value]))\n  };\n  if (a === 'upsert') {\n    if (!['Students', 'Collections'].includes(q.sheet)) throw 'bad sheet';\n    put(q.sheet, q.row); log('save ' + q.sheet, q.row.id); bal();\n    if (q.sheet === 'Collections') collSync_(q.row.id);\n    return { ok: 1 };\n  }\n  if (a === 'delete') {\n    const sn = q.sheet === 'Collections' ? 'Collections' : 'Students';\n    const s = sh(sn), v = s.getDataRange().getValues();\n    const i = v.findIndex((r, k) => k && String(r[0]) === q.id);\n    if (i > 0) s.deleteRow(i + 1);\n    log('delete ' + sn, q.id); bal(); return { ok: 1 };\n  }\n  if (a === 'tx') {   // append-only, duplicate-safe via clientId\n    const t = q.row;\n    if (!rows('Transactions').some(x => x.clientId === t.clientId)) {\n      t.by = ses.n;   // the server decides who recorded it\n      if (t.proofData) {\n        try { t.proof = saveImg(t.proofData, 'pay-' + t.txid); }\n        catch (x) { t.proof = ''; t.note = (t.note ? t.note + '; ' : '') + 'photo not saved'; log('photo failed', t.txid + ' ' + x); }\n        delete t.proofData;\n      }\n      t.receipt = nextReceipt();   // KOL-0001, KOL-0002 ... assigned by the server\n      sh('Transactions').appendRow(H.Transactions.map(k => t[k] == null ? '' : t[k]));\n      log('payment', t.txid + ' ' + t.studentId + ' ' + t.amount + ' ' + (t.method || 'Cash') + (t.ref ? ' ref ' + t.ref : ''));\n      if (t.emailReceipt) mailReceipt(t);\n    }\n    bal(); collSync_(t.collId); return { ok: 1 };\n  }\n  if (a === 'void') {  // never deletes; marks VOID and logs\n    const s = sh('Transactions'), v = s.getDataRange().getValues(), ci = H.Transactions.indexOf('status');\n    const i = v.findIndex((r, k) => k && r[0] === q.txid);\n    if (i < 1) throw 'Transaction not found';\n    s.getRange(i + 1, ci + 1).setValue('VOID');\n    s.getRange(i + 1, ci + 3).setValue('Voided: ' + q.reason);\n    log('void', q.txid + ' ' + q.reason); bal();\n    const vt = rows('Transactions').find(x => x.txid === q.txid); if (vt) collSync_(vt.collId);\n    return { ok: 1 };\n  }\n  if (a === 'exp') {   // expenses: append-only, duplicate-safe via clientId\n    const e = q.row;\n    if (!rows('Expenses').some(x => x.clientId === e.clientId)) {\n      e.by = ses.n; e.status = 'VALID';\n      if (e.proofData) {\n        try { e.proof = saveImg(e.proofData, 'exp-' + e.id); }\n        catch (x) { e.proof = ''; e.note = (e.note ? e.note + '; ' : '') + 'photo not saved'; log('photo failed', e.id + ' ' + x); }\n        delete e.proofData;\n      }\n      sh('Expenses').appendRow(H.Expenses.map(k => e[k] == null ? '' : e[k]));\n      log('expense', e.id + ' ' + e.title + ' ' + e.amount);\n    }\n    return { ok: 1 };\n  }\n  if (a === 'voidexp') {\n    const s = sh('Expenses'), v = s.getDataRange().getValues();\n    const i = v.findIndex((r, k) => k && r[0] === q.id);\n    if (i < 1) throw 'Expense not found';\n    s.getRange(i + 1, H.Expenses.indexOf('status') + 1).setValue('VOID');\n    s.getRange(i + 1, H.Expenses.indexOf('note') + 1).setValue('Voided: ' + q.reason);\n    log('void expense', q.id + ' ' + q.reason); return { ok: 1 };\n  }\n  if (a === 'img') {   // only files inside the KOLEKTA Proofs folder can be read\n    const f = DriveApp.getFileById(q.id), p = f.getParents();\n    if (!p.hasNext() || p.next().getId() !== folder().getId()) throw 'not allowed';\n    const b = f.getBlob();\n    return { data: 'data:' + b.getContentType() + ';base64,' + Utilities.base64Encode(b.getBytes()) };\n  }\n  if (a === 'saveqr') {   // admin uploads the GCash or bank QR image; only its Drive id is stored in Settings\n    const k = q.kind === 'bank' ? 'bank_qr' : 'gcash_qr';\n    const id = saveImg(q.data, 'qr-' + k + '-' + Date.now());\n    put('Settings', { key: k, value: id });\n    log('payment qr', k + ' ' + id); return { ok: 1, id: id };\n  }\n  if (a === 'setcfg') {   // GCash / bank details shown to the treasurers\n    const c = q.cfg || {};\n    ['gcash_name', 'gcash_no', 'bank', 'goal_name', 'goal_amount', 'goal_on', 'gcash_qr', 'bank_qr'].forEach(k => { if (c[k] !== undefined) put('Settings', { key: k, value: String(c[k] || '').slice(0, 200) }); });\n    log('settings', 'payment accounts'); return { ok: 1 };\n  }\n  if (a === 'remcfg') {   // weekly email reminders: on or off, on a chosen day and hour\n    const on = !!q.on, WD = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'];\n    const day = WD.indexOf(String(q.day)) >= 0 ? String(q.day) : 'MONDAY', hr = Number(q.hour), hour = isNaN(hr) ? 8 : Math.min(23, Math.max(0, Math.floor(hr)));\n    ScriptApp.getProjectTriggers().forEach(t => { if (t.getHandlerFunction() === 'weeklyReminders') ScriptApp.deleteTrigger(t); });\n    if (on) ScriptApp.newTrigger('weeklyReminders').timeBased().onWeekDay(ScriptApp.WeekDay[day]).atHour(hour).create();\n    put('Settings', { key: 'auto_remind', value: on ? '1' : '0' }); put('Settings', { key: 'remind_day', value: day }); put('Settings', { key: 'remind_hour', value: String(hour) });\n    log('email reminders', on ? 'weekly on, ' + day + ' ' + hour + ':00' : 'weekly off'); return { ok: 1 };\n  }\n  if (a === 'remind') return Object.assign({ ok: 1 }, sendReminders_());\n  if (a === 'collsheets') return { ok: 1, count: collSyncAll_() };\n  if (a === 'logs') return { logs: rows('Admin Logs').reverse().slice(0, 300) };\n  if (a === 'edittx' || a === 'editexp') {   // admin changes an amount; the old value is kept in the note and the log\n    const tx = a === 'edittx', sn = tx ? 'Transactions' : 'Expenses', s = sh(sn), v = s.getDataRange().getValues(), hd = H[sn];\n    const i = v.findIndex((r, k) => k && String(r[0]) === String(tx ? q.txid : q.id));\n    if (i < 1) throw 'Record not found';\n    const n = Number(q.amount);\n    if (!(n > 0)) throw 'bad amount';\n    const ai = hd.indexOf('amount') + 1, ni = hd.indexOf('note') + 1, old = v[i][ai - 1], on = String(v[i][ni - 1] || '');\n    s.getRange(i + 1, ai).setValue(String(n));\n    s.getRange(i + 1, ni).setValue((on ? on + '; ' : '') + 'Edited: ' + old + ' to ' + n + ' (' + q.reason + ')');\n    log('edit ' + (tx ? 'payment' : 'expense'), (tx ? q.txid : q.id) + ' ' + old + ' to ' + n + ' ' + q.reason);\n    if (tx) { bal(); const et = rows('Transactions').find(x => x.txid === q.txid); if (et) collSync_(et.collId); }\n    return { ok: 1 };\n  }\n  if (a === 'newyear') {   // copy the whole sheet to Drive as an archive, then clear payments and expenses\n    const copy = DriveApp.getFileById(db().getId()).makeCopy('KOLEKTA archive ' + Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd HHmm'));\n    ['Transactions', 'Expenses'].concat(q.collections ? ['Collections'] : [], q.students ? ['Students'] : []).forEach(n => {\n      const s = sh(n), last = s.getLastRow();\n      if (last > 1) s.getRange(2, 1, last - 1, H[n].length).clearContent();\n    });\n    bal(); log('new school year', 'archive ' + copy.getUrl() + (q.collections ? ' +collections' : '') + (q.students ? ' +students' : ''));\n    collSyncAll_();\n    return { ok: 1, url: copy.getUrl() };\n  }\n  throw 'bad action';\n}\nfunction bal() {\n  const S = rows('Students'), C = rows('Collections').filter(c => c.status !== 'CLOSED'),\n    T = rows('Transactions').filter(t => t.status !== 'VOID'), now = new Date().toISOString(),\n    out = [H['Student Balances']];\n  S.forEach(s => {\n    const e = C.filter(c => !c.section || c.section.toUpperCase() === 'ALL' || c.section === s.section).reduce((a, c) => a + Number(c.amount || 0) * times(c), 0);\n    const p = T.filter(t => t.studentId === s.id).reduce((a, t) => a + Number(t.amount), 0);\n    out.push([s.id, s.name, s.section, e, p, Math.max(e - p, 0), p > e ? 'OVERPAID' : (p === e && p > 0) ? 'PAID' : p > 0 ? 'PARTIAL' : 'UNPAID', now]);\n  });\n  const s = sh('Student Balances'); s.clear();\n  s.getRange(1, 1, out.length, 3).setNumberFormat('@');\n  s.getRange(1, 1, out.length, 8).setValues(out);\n}\n\nfunction times(c) {   // how many times a collection has come due\n  if (c.frequency !== 'weekly') return 1;\n  const st = new Date(c.start + 'T00:00:00'), now = new Date();\n  let end = now;\n  if (c.deadline) { const d = new Date(c.deadline + 'T00:00:00'); if (d < end) end = d; }\n  if (isNaN(st) || st > end) return 0;\n  return Math.floor((end - st) / 604800000) + 1;\n}\n\nfunction mailReceipt(t) {   // never blocks or fails the payment itself\n  try {\n    const s = rows('Students').find(x => x.id === t.studentId);\n    if (!s) { log('email skipped', t.txid + ' student not found'); return; }\n    if (!s.email || !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(s.email)) { log('email skipped', t.txid + ' no valid email saved for ' + s.id); return; }\n    if (MailApp.getRemainingDailyQuota() < 1) { log('email skipped', 'daily limit reached ' + t.txid); return; }\n    const C = rows('Collections').filter(c => c.status !== 'CLOSED' && (!c.section || c.section.toUpperCase() === 'ALL' || c.section === s.section));\n    const exp = C.reduce((a, c) => a + Number(c.amount || 0) * times(c), 0);\n    const paid = rows('Transactions').filter(x => x.studentId === s.id && x.status !== 'VOID').reduce((a, x) => a + Number(x.amount), 0);\n    const m = n => 'PHP ' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n    const body = 'PAYMENT RECEIPT\\n\\nName: ' + s.name + '\\nStudent ID: ' + s.id + '\\nSection: ' + s.section +\n      '\\n\\nCollection: ' + t.collection + '\\nAmount paid: ' + m(t.amount) + '\\nPayment method: ' + (t.method || 'Cash') + (t.ref ? '\\nReference no.: ' + t.ref : '') +\n      '\\nReceipt no.: ' + (t.receipt || t.txid) + '\\nTransaction ID: ' + t.txid + '\\nDate: ' + t.date + ' ' + t.time + '\\nReceived by: ' + t.by +\n      '\\n\\nTotal paid so far: ' + m(paid) + '\\nRemaining balance: ' + m(Math.max(exp - paid, 0)) +\n      '\\n\\nKeep this email as your proof of payment. If something looks wrong, tell your treasurer.';\n    MailApp.sendEmail({ to: s.email, subject: 'Payment receipt ' + (t.receipt || t.txid), body: body, name: 'KOLEKTA' });\n    log('email sent', t.txid + ' ' + s.email);\n  } catch (e) { log('email failed', t.txid + ' ' + e); }\n}\n\nfunction nextReceipt() {\n  const s = sh('Transactions'), ci = H.Transactions.indexOf('receipt') + 1, last = s.getLastRow();\n  let mx = 0;\n  if (last > 1) s.getRange(2, ci, last - 1, 1).getValues().forEach(r => { const m = /(\\d+)$/.exec(String(r[0])); if (m) mx = Math.max(mx, Number(m[1])); });\n  return 'KOL-' + String(mx + 1).padStart(4, '0');\n}\n\nfunction weeklyReminders() {   // runs from the Monday 8 AM trigger\n  CUR = 'system (weekly reminders)';\n  const L = LockService.getScriptLock(); L.waitLock(20000);\n  try { sendReminders_(); } finally { L.releaseLock(); }\n}\n\nfunction sendReminders_() {   // emails every student who still owes something and has an email saved\n  const S = rows('Students'), C = rows('Collections').filter(c => c.status !== 'CLOSED'), T = rows('Transactions').filter(t => t.status !== 'VOID'),\n    cfg = Object.fromEntries(rows('Settings').map(x => [x.key, x.value])),\n    m = n => 'PHP ' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),\n    pay = [cfg.gcash_no ? 'GCash ' + cfg.gcash_no + (cfg.gcash_name ? ' (' + cfg.gcash_name + ')' : '') : '', cfg.bank || ''].filter(Boolean).join(' / ');\n  let sent = 0, skipped = 0;\n  S.forEach(s => {\n    const lines = []; let total = 0;\n    C.filter(c => !c.section || c.section.toUpperCase() === 'ALL' || c.section === s.section).forEach(c => {\n      const exp = Number(c.amount || 0) * times(c), paid = T.filter(t => t.studentId === s.id && t.collId === c.id).reduce((a, t) => a + Number(t.amount), 0), rem = exp - paid;\n      if (rem > 0.004) { total += rem; lines.push('- ' + c.name + ': ' + m(rem) + (c.deadline ? ' (deadline ' + c.deadline + ')' : '')); }\n    });\n    if (!lines.length) return;\n    if (!s.email || !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(s.email) || MailApp.getRemainingDailyQuota() < 1) { skipped++; return; }\n    try {\n      MailApp.sendEmail({ to: s.email, subject: 'Class fund reminder', name: 'KOLEKTA',\n        body: 'Hi ' + s.name + ',\\n\\nPaalala lang po tungkol sa class fund. May natitira ka pang balance na ' + m(total) + ':\\n\\n' + lines.join('\\n') +\n          (pay ? '\\n\\nPwede magbayad via ' + pay + ' o cash sa treasurer.' : '\\n\\nPwede magbayad sa treasurer.') +\n          '\\n\\nKung nakapagbayad ka na, pakisabihan ang treasurer. Salamat!' });\n      sent++;\n    } catch (e) { skipped++; }\n  });\n  log('email reminders', sent + ' sent, ' + skipped + ' skipped');\n  return { sent: sent, skipped: skipped };\n}\n\n// ---------- one tab per collection (\"Coll - <name>\"): students on the left, payments on the right ----------\nfunction collTab_(c) {\n  const ss = db(), P = PropertiesService.getScriptProperties(), map = JSON.parse(P.getProperty('COLL_TABS') || '{}');\n  const base = 'Coll - ' + String(c.name || c.id).replace(/[\\[\\]*?\\/\\\\:]/g, '').slice(0, 60);\n  const taken = Object.keys(map).filter(k => k !== c.id).map(k => map[k]);\n  const name = taken.indexOf(base) >= 0 ? base + ' (' + String(c.id).slice(-4) + ')' : base;\n  let s = map[c.id] ? ss.getSheetByName(map[c.id]) : null;\n  if (!s) s = ss.getSheetByName(name) || ss.insertSheet(name);\n  else if (s.getName() !== name && !ss.getSheetByName(name)) s.setName(name);\n  map[c.id] = s.getName();\n  P.setProperty('COLL_TABS', JSON.stringify(map));\n  return s;\n}\nfunction buildColl_(c, S, T) {\n  const s = collTab_(c), a = Number(c.amount || 0), exp = a * times(c), mine = T.filter(t => t.collId === c.id);\n  const stud = S.filter(x => !c.section || c.section.toUpperCase() === 'ALL' || c.section === x.section);\n  const L = stud.map(x => {\n    const p = mine.filter(t => t.studentId === x.id && t.status !== 'VOID'), paid = p.reduce((k, t) => k + Number(t.amount), 0), last = p.map(t => t.date).sort().pop() || '';\n    return [x.id, x.name, x.section, exp, paid, Math.max(exp - paid, 0), paid > exp ? 'OVERPAID' : (paid === exp && paid > 0) ? 'PAID' : paid > 0 ? 'PARTIAL' : 'UNPAID', last];\n  });\n  const R = mine.slice().sort((x, y) => (x.date + x.time) < (y.date + y.time) ? -1 : 1)\n    .map(t => [t.date, t.time, t.studentId, t.name, Number(t.amount), t.method || 'Cash', t.ref || '', t.receipt || t.txid, t.status === 'VOID' ? 'VOID' : 'VALID', t.by]);\n  s.clear();\n  const title = c.name + '  |  ' + (c.frequency === 'weekly' ? 'weekly' : 'one-time') + ' PHP ' + a + (c.deadline ? '  |  deadline ' + c.deadline : '');\n  const stamp = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd HH:mm');\n  s.getRange(1, 1).setValue(title + '  |  updated ' + stamp);\n  s.getRange(1, 1).setFontWeight('bold');\n  const h1 = s.getRange(3, 1, 1, 8);\n  h1.setValues([['Student ID', 'Name', 'Section', 'Expected', 'Paid', 'Balance', 'Status', 'Last payment']]);\n  h1.setFontWeight('bold');\n  h1.setBackground('#d9f5e3');\n  const h2 = s.getRange(3, 10, 1, 10);\n  h2.setValues([['Date', 'Time', 'Student ID', 'Name', 'Amount', 'Method', 'Reference', 'Receipt no.', 'Status', 'Recorded by']]);\n  h2.setFontWeight('bold');\n  h2.setBackground('#d9f5e3');\n  if (L.length) {\n    s.getRange(4, 1, L.length, 3).setNumberFormat('@'); s.getRange(4, 8, L.length, 1).setNumberFormat('@');\n    s.getRange(4, 1, L.length, 8).setValues(L);\n    const sum = i => L.reduce((k, r) => k + Number(r[i]), 0);\n    s.getRange(4 + L.length, 1, 1, 8).setValues([['', 'TOTAL', '', sum(3), sum(4), sum(5), '', '']]).setFontWeight('bold');\n  }\n  if (R.length) { s.getRange(4, 10, R.length, 3).setNumberFormat('@'); s.getRange(4, 10, R.length, 10).setValues(R); }\n  s.setFrozenRows(3);\n  s.autoResizeColumns(1, 19);\n}\nfunction collSync_(id) {   // never blocks or fails the payment itself\n  try {\n    const c = rows('Collections').find(x => x.id === String(id));\n    if (c) buildColl_(c, rows('Students'), rows('Transactions'));\n  } catch (e) { log('collection sheet failed', id + ' ' + e); }\n}\nfunction collSyncAll_() {\n  const S = rows('Students'), T = rows('Transactions'), C = rows('Collections');\n  C.forEach(c => { try { buildColl_(c, S, T); } catch (e) { log('collection sheet failed', c.id + ' ' + e); } });\n  return C.length;\n}\n\n// END OF FILE (KOLEKTA backend 2026-11-14c). If you do not see this line at the bottom, the paste was cut off.\n";

function logList(){const q=lq.toLowerCase(),l=LG.filter(x=>!q||(x.user+' '+x.action+' '+x.detail).toLowerCase().includes(q));$('#lgc').textContent=l.length+' entries, latest first';$('#lgl').innerHTML=l.slice(0,150).map(x=>{const d=new Date(x.time);return`<div class=card><div class=row><b>${esc(x.action)}</b><span class=s>${isNaN(d)?esc(x.time):esc(d.toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'}))}</span></div><div class=s>${esc(x.user)}</div><div class=s style="word-break:break-word">${esc(x.detail)}</div></div>`}).join('')}
function nyForm(){modal(`<h2>Start new school year</h2><div class=s>1. A backup file downloads to this phone.<br>2. The whole Google Sheet is copied to Drive as an archive.<br>3. All payments and expenses are cleared. Collections and students stay unless you tick them below.</div><label style="display:flex;gap:8px;align-items:center"><input type=checkbox id=ny_c style="width:auto;margin:0">Also remove collections</label><label style="display:flex;gap:8px;align-items:center"><input type=checkbox id=ny_s style="width:auto;margin:0">Also remove students</label>${fld('nyc','Type NEW YEAR to confirm','')}<button class="btn d" onclick=nyGo()>Archive and start fresh</button><button class="btn s2" onclick=closeM()>Cancel</button>`)}
async function nyGo(){if(fv('nyc')!=='NEW YEAR')return toast('Type NEW YEAR to confirm',1);if(S.pend.length||S.pendx.length)return toast('Sync your unsynced items first',1);if(!navigator.onLine)return toast('Go online first',1);const c=$('#ny_c').checked,st=$('#ny_s').checked;try{backup();const j=await api('newyear',{collections:c,students:st});await load();render();modal(`<h2>Done</h2><div class=s>Archive saved to Drive:</div><div class=card style="word-break:break-all">${esc(j.url||'')}</div><button class="btn s2" onclick=closeM()>Close</button>`)}catch(e){toast('Could not finish: '+String(e.message||e).slice(0,80),1)}}

// ===== Fund goal and email reminders =====
const DAYS=[['MONDAY','Monday'],['TUESDAY','Tuesday'],['WEDNESDAY','Wednesday'],['THURSDAY','Thursday'],['FRIDAY','Friday'],['SATURDAY','Saturday'],['SUNDAY','Sunday']],hLbl=h=>(h%12||12)+':00 '+(h<12?'AM':'PM');
const goalOn=()=>{const c=S.cfg||{};return c.goal_on==='1'||(c.goal_on===undefined&&Number(c.goal_amount)>0)};
const goalCard=()=>{const g=Number((S.cfg||{}).goal_amount)||0;if(!goalOn()||g<=0)return'';const c=collected(),p=Math.min(100,c/g*100);return`<div class=card><div class=row><b>${esc((S.cfg||{}).goal_name||'Fund goal')}</b><b>${p.toFixed(0)}%</b></div><div class=pb style="margin:8px 0"><i style="width:${p}%"></i></div><div class=s>${money(c)} collected of ${money(g)} \u2022 ${c>=g?'Goal reached!':money(g-c)+' to go'}</div></div>`};
async function saveGoal(){const on=$('#gon').checked,a=Number(fv('ga'))||0;if(on&&a<=0)return toast('Enter a target amount, or turn the goal off',1);const c={goal_on:on?'1':'0',goal_name:fv('gl'),goal_amount:String(a>0?a:0)};try{await api('setcfg',{cfg:c});S.cfg=Object.assign({},S.cfg,c);save();render();done(on?'Goal saved':'Goal hidden')}catch(e){toast('Could not save. Go online and retry.',1)}}
async function remAuto(on){const d=($('#rd')||{}).value||'MONDAY',h=Number(($('#rh')||{}).value||8);try{await api('remcfg',{on:!!on,day:d,hour:h});S.cfg=Object.assign({},S.cfg,{auto_remind:on?'1':'0',remind_day:d,remind_hour:String(h)});save();render();done(on?'Weekly reminders on':'Weekly reminders off',on?DAYS.find(x=>x[0]===d)[1]+' '+hLbl(h):'')}catch(e){toast('Could not change it: '+String(e.message||e).slice(0,70),1)}}
async function remNow(){if(!confirm('Email every student who has a balance and a saved email now?'))return;try{const j=await api('remind',{});done('Reminders sent',(j.sent||0)+' sent, '+(j.skipped||0)+' skipped')}catch(e){toast('Could not send: '+String(e.message||e).slice(0,70),1)}}
function setLkTo(v){W('lkto',Number(v));done('Saved')}
function signOut(){const n=S.pend.length+S.pendx.length;if(confirm(n?n+' item(s) are not synced yet and stay on this phone. Sign out anyway?':'Sign out?'))logout()}

// ===== Cleaner layout: collapsible Settings, grouped popup buttons =====
const SIC={'Payment accounts':'\u{1F4B3}','Fund goal (optional)':'\u{1F3AF}','Email reminders':'\u2709\uFE0F','New school year':'\u{1F5D3}\uFE0F','Backend code (Apps Script)':'\u{1F9E9}','Backup':'\u{1F4BE}','Collection sheets':'\u{1F4D1}','Appearance':'\u{1F3A8}','App lock':'\u{1F512}','Install app':'\u{1F4F2}'},OPEN=new Set();
function collapsify(root){if(!root)return;[...root.children].forEach(c=>{if(!c.classList||!c.classList.contains('card')||!c.firstElementChild||c.firstElementChild.tagName!=='B')return;const b=c.firstElementChild,t=b.textContent.trim(),d=document.createElement('details'),sm=document.createElement('summary'),body=document.createElement('div');d.className='card acc';if(OPEN.has(t))d.open=true;d.addEventListener('toggle',()=>{d.open?OPEN.add(t):OPEN.delete(t)});sm.innerHTML='<span class=ti2>'+(SIC[t]||'\u2022')+'</span><b>'+esc(t)+'</b>';body.className='accb';b.remove();while(c.firstChild)body.appendChild(c.firstChild);d.appendChild(sm);d.appendChild(body);c.replaceWith(d)})}
{const _vs=V.set;V.set=function(){_vs.apply(this,arguments);collapsify($('#v'))}}
function groupBtns(root){if(!root)return;[...root.querySelectorAll('.md,.np')].forEach(p=>{let run=[];const flush=()=>{if(run.length>1){const g=document.createElement('div');g.className='bgrid';run[0].before(g);run.forEach(b=>g.appendChild(b))}run=[]};[...p.children].forEach(ch=>{if(ch.tagName==='BUTTON'&&ch.classList.contains('btn')&&ch.classList.contains('s2'))run.push(ch);else flush()});flush()})}
{const _modal=modal;modal=function(h){_modal(h);groupBtns($('#m'))}}


// ===== Payment QR codes (GCash / bank), uploaded by the admin and shared with every treasurer =====
LBL.saveqr='Uploading QR...';
const QK={GCash:'gcash_qr','Bank transfer':'bank_qr',gcash:'gcash_qr',bank:'bank_qr'};
async function getQr(kk){const id=(S.cfg||{})[kk];if(!id)return'';if(S.im[id])return S.im[id];let d=L('qrc_'+id);if(!d){try{d=(await api('img',{id},1)).data}catch(e){return''}W('qrc_'+id,d)}S.im[id]=d;return d}
function qrWarm(){['gcash_qr','bank_qr'].forEach(k=>getQr(k))}
const qrBox=ad=>['gcash','bank'].map(k=>`<div style="margin-top:16px"><div class=s><b>${k==='gcash'?'GCash':'Bank'} QR code</b></div><div id=qp_${k} class=ctr style="margin-top:6px"></div>${ad?`<label style="margin:6px 0">Upload or replace<input type=file accept="image/*" onchange="upQr('${k}',this)"></label>`:''}</div>`).join('');
async function qrPrev(){for(const k of ['gcash','bank']){const e=$('#qp_'+k);if(!e)continue;const kk=QK[k];if(!(S.cfg||{})[kk]){e.innerHTML='<div class=s>No QR uploaded yet</div>';continue}e.innerHTML='<i class=spin></i>';const d=await getQr(kk),x=$('#qp_'+k);if(!x)continue;x.innerHTML=d?`<img class=pvimg src="${d}" alt="QR" style="max-height:200px;background:#fff;padding:8px">${isAdmin()?`<button class="btn d" style="margin:0" onclick="rmQr('${k}')">Remove QR</button>`:''}`:'<div class=s>Could not load the QR. Go online and retry.</div>'}}
async function upQr(k,inp){const f=inp.files[0];if(!f)return;if(!navigator.onLine){inp.value='';return toast('Go online to upload',1)}let d;try{d=await shrink(f,900,.92)}catch(e){inp.value='';return toast('Could not read that image',1)}
try{const j=await api('saveqr',{kind:k,data:d});const kk=QK[k];S.cfg=Object.assign({},S.cfg,{[kk]:j.id});S.im[j.id]=d;W('qrc_'+j.id,d);save();render();done('QR saved',k==='gcash'?'GCash':'Bank')}catch(e){inp.value='';toast('Could not upload: '+String(e.message||e).slice(0,70),1)}}
async function rmQr(k){if(!confirm('Remove this QR code?'))return;const kk=QK[k];try{await api('setcfg',{cfg:{[kk]:''}});S.cfg=Object.assign({},S.cfg,{[kk]:''});save();render();done('QR removed')}catch(e){toast('Could not remove. Go online and retry.',1)}}
async function qrFill(m){const d=await getQr(QK[m]),e=$('#rq');if(e&&d)e.innerHTML=`<img class=pvimg src="${d}" alt="Payment QR" style="max-height:260px;background:#fff;padding:8px">`}
async function showQrM(m){m=m||($('#pm')||{}).value;const kk=QK[m];if(!kk||!(S.cfg||{})[kk])return toast('No QR uploaded for '+m,1);const c=S.cfg||{};modal('<div class=ctr><div class=s style="padding:30px 0"><i class=spin style="margin-right:10px"></i>Loading QR...</div></div>');const d=await getQr(kk);if(!d)return modal('<div class=ctr><div class=s style="padding:20px 0">Could not load the QR. Go online and retry.</div></div><button class="btn s2" onclick=closeM()>Close</button>');
const acc=m==='GCash'?[c.gcash_name,c.gcash_no].filter(Boolean).join(' '):(c.bank||'');modal(`<h2 class=ctr>${esc(m)}</h2><div class=ctr><img class=pvimg src="${d}" alt="Payment QR" style="max-height:62vh;background:#fff;padding:12px">${acc?`<div class=s style="margin-top:6px">${esc(acc)}</div>`:''}</div><button class="btn a" onclick=closeM()>Close</button>`)}

// ===== Collection sheets + closing report signatures =====
async function collSheets(){try{const j=await api('collsheets',{});done('Collection sheets updated',(j.count||0)+' tabs')}catch(e){toast('Could not update: '+String(e.message||e).slice(0,70),1)}}
const lsg=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const sigsGet=()=>{try{const a=JSON.parse(localStorage.getItem('sigs'));if(Array.isArray(a))return a}catch(e){}return[{n:lsg('nameT')||(isAdmin()?'':S.name||''),r:'Treasurer',s:lsg('sigT')},{n:lsg('nameM')||(isAdmin()?S.name||'':''),r:'Class Mayor',s:lsg('sigM')}]};
// Each signatory: signature image on top, the printed name sitting right above the line, the position under the line.
function sigBlock(){const l=sigsGet();if(!l.length)return'';const one=(o,i)=>`<div style="text-align:center;${l.length>1&&l.length%2&&i===l.length-1?'grid-column:1/-1;width:50%;justify-self:center':''}"><div style="height:64px;display:flex;align-items:flex-end;justify-content:center">${o.s?`<img src="${o.s}" alt="" style="max-height:64px;max-width:100%;object-fit:contain;background:#fff;border-radius:6px">`:''}</div><div style="border-bottom:1.5px solid var(--ink);padding:0 4px 3px;min-height:24px;margin-top:2px"><b>${esc(o.n)}</b></div><div class=s style="margin-top:4px">${esc(o.r)}</div></div>`;return`<div class=card style="margin-top:24px"><div style="display:grid;grid-template-columns:${l.length>1?'1fr 1fr':'1fr'};gap:30px 20px">${l.map(one).join('')}</div></div>`}
let SGN=0,SGS={};
function sigRow(o){const u=++SGN;SGS[u]=o.s||'';return`<div class="card sgi" data-u=${u} style="margin:10px 0"><label style="margin-top:0">Name<input class=sgn value="${esc(o.n)}" placeholder="Full name" autocomplete=off></label><label>Position<input class=sgr value="${esc(o.r)}" placeholder="e.g. Treasurer, Class Adviser" autocomplete=off></label><div class=s>Signature (draw with your finger)</div><canvas id=cv_${u} class=sigc width=600 height=220></canvas><div style="display:flex;gap:8px"><button class="btn s2" style="margin:0" onclick="sigClr(${u})">Clear</button><button class="btn d" style="margin:0" onclick="sigDel(${u})">Remove</button></div></div>`}
function sigForm(){SGN=0;SGS={};const l=sigsGet();modal(`<h2>Signatories</h2><div class=s>Saved on this phone only. They appear on the closing report in this order, so you can print right away.</div><div id=sgl>${l.map(sigRow).join('')}</div><button class="btn s2" onclick=sigAdd()>+ Add signatory</button><button class="btn a" onclick=sigSave()>Save</button><button class="btn s2" onclick="closeM();closeRep()">Cancel</button>`);document.querySelectorAll('.sgi').forEach(e=>sigInit(e.dataset.u))}
function sigAdd(){if(document.querySelectorAll('.sgi').length>=8)return toast('Up to 8 signatories',1);const g=$('#sgl');g.insertAdjacentHTML('beforeend',sigRow({n:'',r:'',s:''}));const e=g.lastElementChild;sigInit(e.dataset.u);e.scrollIntoView({behavior:'smooth',block:'center'});const n=e.querySelector('.sgn');n&&n.focus({preventScroll:true})}
function sigDel(u){const e=document.querySelector('.sgi[data-u="'+u+'"]');e&&e.remove()}
function sigInit(u){const c=$('#cv_'+u),x=c.getContext('2d'),sv=SGS[u];x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0d1b14';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);if(sv){c.dataset.has='1';const i=new Image();i.onload=()=>x.drawImage(i,0,0,c.width,c.height);i.src=sv}
let d=0;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);const[p,q]=pt(e);x.beginPath();x.moveTo(p,q);x.lineTo(p+.1,q+.1);x.stroke();c.dataset.has='1'};
c.onpointermove=e=>{if(!d)return;const[p,q]=pt(e);x.lineTo(p,q);x.stroke()};c.onpointerup=c.onpointercancel=()=>{d=0}}
function sigClr(u){const c=$('#cv_'+u),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);c.dataset.has=''}
function sigSave(){const l=[...document.querySelectorAll('.sgi')].map(e=>{const c=e.querySelector('canvas');return{n:e.querySelector('.sgn').value.trim(),r:e.querySelector('.sgr').value.trim(),s:c.dataset.has?c.toDataURL('image/png'):''}});try{localStorage.setItem('sigs',JSON.stringify(l))}catch(e){return toast('Could not save on this phone',1)}closeM();closeRep();done('Saved')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{if(localStorage.getItem('lkmig')!=='25'){localStorage.removeItem('lkto');localStorage.setItem('lkmig','25')}}catch(e){}
if(S.tok&&lockOn()&&(localStorage.getItem('lkl')||!lkFresh()))lockUnlock();else lkTouch();
boot();
</script></body></html>
